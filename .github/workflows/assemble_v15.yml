name: Assemble requested v15 changes
on:
  push:
    branches: [feat/table-help-chart-ranges]
    paths: [tools/apply_v15.py, .github/workflows/assemble_v15.yml, dashboard_help.py, chart_ranges.py, tests/test_v15.py, enhanced_smoke.py]
permissions:
  contents: write
concurrency:
  group: assemble-v15
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hash-guarded presentation changes
        run: python tools/apply_v15.py
      - name: Test before recording source changes
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q tests
      - name: Record only the validated application changes on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py dashboard_runtime.py dashboard_core.py dashboard_views.py dashboard_ui.py workspace_boot.py production_smoke.py README.md
          git commit -m 'Apply v15 pagination, explanatory tooltips and correctly bounded chart ranges'
          git push origin HEAD:feat/table-help-chart-ranges
