name: Assemble chart point inspector
on:
  push:
    branches: [feat/chart-point-inspector-v18]
    paths: [assemble_hover.py, chart_inspector.py, hover_smoke.py, tests/test_chart_inspector.py, .github/workflows/assemble_hover.yml]
permissions:
  contents: write
concurrency:
  group: assemble-chart-point-inspector
  cancel-in-progress: false
jobs:
  assemble:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact guarded source changes
        run: python assemble_hover.py
      - name: Validate application and all regressions
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q tests
      - name: Commit tested source only to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chart_ranges.py app.py dashboard_runtime.py workspace_boot.py enhanced_smoke.py README.md
          git commit -m 'Integrate tested point inspector without modifying calculations or tables'
          git push origin HEAD:feat/chart-point-inspector-v18
