name: Finish and test research workspace
on:
  push:
    branches: [feat/returns-filters-etf-v21]
    paths: [.github/workflows/finish_release.yml]
permissions:
  contents: write
concurrency:
  group: finish-workspace-source
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'sippakorntwo-glitch/stock-dashboard' && github.ref == 'refs/heads/feat/returns-filters-etf-v21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-dev.txt
      - name: Integrate guarded application changes
        run: |
          mkdir -p work
          if ! grep -q '2026-09-12.22' app.py; then python finish_release.py; fi
          python - <<'PY'
          from pathlib import Path
          p=Path('.streamlit/config.toml');s=p.read_text()
          if 'maxUploadSize' not in s:s += 'maxUploadSize = 5\n\n[browser]\ngatherUsageStats = false\n'
          p.write_text(s)
          PY
          python -m compileall -q .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py dashboard_runtime.py dashboard_ui.py chart_ranges.py workspace_boot.py filters_ui.py tests/conftest.py .streamlit/config.toml
          git diff --cached --quiet || git commit -m 'Integrate final colorful UI, isolated minute-price refresh and coherent audit records'
          git push origin HEAD:feat/returns-filters-etf-v21
      - name: Full application and regression suite
        run: python -m pytest -q tests > work/final-tests.log 2>&1 || { tail -140 work/final-tests.log; exit 1; }
      - name: Publish bounded CI result for review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          from verification_report import publish_report
          logs={p.name:p.read_text(errors='replace')[-24000:] for p in Path('work').glob('*.log')}
          audit=Path('work/source-audit.txt')
          publish_report('unit',{'result':os.environ['RESULT'],'tested_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'logs':logs,'source_audit':audit.read_text() if audit.exists() else ''})
          PY
