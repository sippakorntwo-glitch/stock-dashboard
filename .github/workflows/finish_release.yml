name: Finish and test research workspace
on:
  push:
    branches: [feat/returns-filters-etf-v21]
    paths: [.github/workflows/finish_release.yml]
permissions:
  contents: write
concurrency:
  group: finish-workspace-source
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'sippakorntwo-glitch/stock-dashboard' && github.ref == 'refs/heads/feat/returns-filters-etf-v21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-dev.txt
      - name: Package the reviewed source
        run: |
          mkdir -p work
          python tidy_release.py
          python -m compileall -q .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add RETURN_PERIODS.md RELEASE_NOTES_V22.md
          git diff --cached --quiet || git commit -m 'Package final release, preserve upload/privacy limits and align production verification'
          git push origin HEAD:feat/returns-filters-etf-v21
      - name: Full application and regression suite
        run: python -m pytest -q tests > work/final-tests.log 2>&1 || { tail -140 work/final-tests.log; exit 1; }
      - name: Publish bounded CI result for review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          from verification_report import publish_report
          logs={p.name:p.read_text(errors='replace')[-24000:] for p in Path('work').glob('*.log')}
          publish_report('unit',{'result':os.environ['RESULT'],'tested_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'logs':logs})
          PY
