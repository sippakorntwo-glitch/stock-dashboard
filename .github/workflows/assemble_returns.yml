name: Assemble and test English return periods
on:
  push:
    branches: [feat/english-return-periods-v20]
    paths: [apply_return_upgrade.py, return_periods.py, tests/test_return_periods.py, .github/workflows/assemble_returns.yml]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'sippakorntwo-glitch/stock-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed guarded edits
        run: python apply_return_upgrade.py
      - name: Test actual dependencies and all regressions
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q tests
      - name: Commit validated edits only to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics.py dashboard_runtime.py dashboard_core.py dashboard_views.py data_quality.py dashboard_help.py update_data.py tests/test_analytics.py workspace_boot.py app.py
          git commit -m 'Integrate validated English return columns and six-year source history'
          git push origin HEAD:feat/english-return-periods-v20
