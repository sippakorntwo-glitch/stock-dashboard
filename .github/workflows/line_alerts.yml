name: LINE stock alerts
on:
  workflow_run:
    workflows: ['Refresh Top 10 board (30 minutes)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan = notify new confirmed stocks; test = one setup message; dry-run = no delivery'
        type: choice
        options: [scan, test, dry-run]
        default: scan
permissions:
  contents: read
concurrency:
  group: line-stock-alert-delivery
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install entry-policy dependency
        run: python -m pip install -q pandas==2.2.3
      - name: Verify notification safety checks
        run: python -m unittest discover -s tests -p test_line_alerts.py
      - name: Deliver only confirmed, current, new signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ALERT_MODE: ${{ inputs.mode || 'scan' }}
        run: python line_alerts.py --mode "$ALERT_MODE"
