name: LINE stock alerts
on:
  schedule:
    # Ten-minute event scans; exchange-calendar/session checks skip closed times.
    # LINE messages still obey planned rounds, event deduplication and quota.
    - cron: '6,16,26,36,46,56 10-21 * * 1-5'
  push:
    branches: [main]
    paths: ['.github/workflows/line_alerts.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'monitor = event board plus quota-limited notices; schedule-check = plan without delivery'
        type: choice
        options: [monitor, format-update, scheduled, schedule-check, scan, test, dry-run, preview]
        default: monitor
permissions:
  contents: read
concurrency:
  group: line-stock-alert-delivery
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reporting dependencies and Thai font
        run: |
          python -m pip install -q -r requirements-line-alerts.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
      - name: Verify notification safety checks
        run: |
          python -m unittest discover -s tests -p 'test_line_alert*.py'
          python -m unittest discover -s tests -p 'test_stock_alert*.py'
          python -m unittest discover -s tests -p 'test_short_term*.py'
      - name: Restore pinned Thai translation model
        uses: actions/cache@v4
        with:
          path: work/thai-model
          key: thai-qwen3-4b-bc640142-llama-b11349-v1
      - name: Restore exact-source Thai translations
        uses: actions/cache@v4
        with:
          path: work/thai-translations.json
          key: thai-finance-v1-${{ github.run_id }}
          restore-keys: thai-finance-v1-
      - name: Prepare offline Thai translator before live prices
        timeout-minutes: 3
        continue-on-error: true
        run: python prepare_thai_translation.py
      - name: Refresh events and deliver new notices or due reports within monthly quota
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # The requested format sample is sent once per durable presentation
          # version. Scheduled scans stay in monitor mode and share quota limits.
          ALERT_MODE: ${{ inputs.mode || (github.event_name == 'push' && 'format-update') || 'monitor' }}
        run: python line_alerts.py --mode "$ALERT_MODE"
      - name: Preserve the report that was prepared
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line-stock-report
          path: work/line-report/
          if-no-files-found: ignore
          retention-days: 7
