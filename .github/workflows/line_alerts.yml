name: LINE stock alerts
on:
  schedule:
    # Independent wake-up shortly after the :07/:37 ranking refresh. The
    # completion event is a second wake-up; durable slot keys allow one push.
    - cron: '16,46 10-21 * * 1-5'
  push:
    branches: [main]
    paths: ['.github/workflows/line_alerts.yml']
  workflow_run:
    workflows: ['Refresh Top 10 board (30 minutes)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled = due quota-planned round; schedule-check = quota and plan without delivery'
        type: choice
        options: [scheduled, schedule-check, scan, test, dry-run, preview]
        default: scheduled
permissions:
  contents: read
concurrency:
  group: line-stock-alert-delivery
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reporting dependencies and Thai font
        run: |
          python -m pip install -q -r requirements-line-alerts.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
      - name: Verify notification safety checks
        run: |
          python -m unittest discover -s tests -p 'test_line_alert*.py'
          python -m unittest discover -s tests -p 'test_stock_alert*.py'
      - name: Deliver the due pre-market or regular report within monthly quota
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ALERT_MODE: ${{ inputs.mode || 'scheduled' }}
        run: python line_alerts.py --mode "$ALERT_MODE"
      - name: Preserve the report that was prepared
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line-stock-report
          path: work/line-report/
          if-no-files-found: ignore
          retention-days: 7
