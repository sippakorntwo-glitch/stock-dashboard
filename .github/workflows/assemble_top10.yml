name: Assemble Top 10 board change
on:
  push:
    branches: [feat/top10-buy-watch-board]
    paths: [assemble_top10.py, '.github/workflows/assemble_top10.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded source changes and isolated test fixtures
        run: python assemble_top10.py
      - name: Test integration and ranking without real provider calls
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q tests
      - name: Commit only application code (workflow edits require the owner connection)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard_views.py dashboard_ui.py dashboard_runtime.py app.py workspace_boot.py enhanced_smoke.py tests/conftest.py tests/test_ui.py README.md
          git commit -m 'Apply tested Top 10 board application and UI integration'
          git push origin HEAD:feat/top10-buy-watch-board
