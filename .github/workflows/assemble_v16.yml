name: Assemble requested period growth changes
on:
  push:
    branches: [feat/period-growth-clean-tooltips]
    paths: [.github/scripts/assemble_v16.py]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded source edits
        run: python .github/scripts/assemble_v16.py
      - name: Test actual application before saving changes
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q tests
      - name: Save tested changes to the feature branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import requests
          repo=os.environ['GITHUB_REPOSITORY']
          branch='feat/period-growth-clean-tooltips'
          expected=os.environ['GITHUB_SHA']
          if repo!='sippakorntwo-glitch/stock-dashboard' or os.environ['GITHUB_REF']!='refs/heads/'+branch:
              raise RuntimeError('Unexpected repository/ref')
          session=requests.Session()
          session.headers.update({'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          def call(method,path,**kw):
              r=session.request(method,'https://api.github.com/repos/'+repo+path,timeout=60,**kw)
              r.raise_for_status()
              return r.json()
          ref=call('GET','/git/ref/heads/'+branch)
          if ref['object']['sha']!=expected:raise RuntimeError('Branch advanced, refusing write')
          base=call('GET','/git/commits/'+expected)['tree']['sha']
          files=json.loads(Path('/tmp/v16-files.json').read_text())
          tree=call('POST','/git/trees',json={'base_tree':base,'tree':[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text(encoding='utf-8')} for p in files]})['sha']
          commit=call('POST','/git/commits',json={'message':'Apply tested period-return header and remove redundant table tooltips','tree':tree,'parents':[expected]})['sha']
          call('PATCH','/git/refs/heads/'+branch,json={'sha':commit,'force':False})
          print('TESTED_FEATURE_COMMIT',commit)
          PY
