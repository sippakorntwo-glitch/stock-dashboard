name: Assemble audited data completeness repair
on:
  push:
    branches: [fix/dashboard-data-completeness-v19]
    paths: ['apply_quality_upgrade.py', 'data_quality.py', 'metadata_repair.py', 'quality_views.py', 'tests/test_data_quality.py', '.github/workflows/assemble_quality.yml']
permissions:
  contents: write
concurrency:
  group: assemble-quality-v19
  cancel-in-progress: false
jobs:
  assemble:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded source edits
        run: python apply_quality_upgrade.py
      - name: Compile and run all tests with real dependencies
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q tests
      - name: Commit only verified source edits to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py dashboard_runtime.py dashboard_ui.py dashboard_views.py dashboard_help.py dashboard_core.py data_sync.py update_data.py ranking_job.py workspace_boot.py README.md
          git commit -m 'Apply validated completeness reporting, metadata repair and consistent ranking universe'
          git push origin HEAD:fix/dashboard-data-completeness-v19
