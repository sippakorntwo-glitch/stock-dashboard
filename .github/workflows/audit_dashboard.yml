name: Audit dashboard data completeness
on:
  push:
    branches: [fix/dashboard-data-completeness-v19]
    paths: ['audit_dashboard.py', '.github/workflows/audit_dashboard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - name: Inspect every catalog member and every displayed data family
        env:
          PYTHONUNBUFFERED: '1'
        run: python audit_dashboard.py
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-data-completeness-audit
          path: work/audit_before.*
          retention-days: 7
