name: Financial statement coverage and audit
on:
  push:
    branches: [feat/company-financial-review-v28]
    paths: [.github/workflows/financial_review_data.yml]
  schedule:
    - cron: '41 1 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepared-market-data
  cancel-in-progress: false
jobs:
  financials:
    if: github.repository == 'sippakorntwo-glitch/stock-dashboard' && toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-dev.txt
      - name: Test formula and period contracts before publication
        run: |
          mkdir -p work
          python -m compileall -q .
          python -m pytest -q tests > work/financial-tests.log 2>&1 || { tail -100 work/financial-tests.log; exit 1; }
      - name: Read official bulk statements and audit every member
        env:
          DASHBOARD_DATA_REPO: ${{ github.repository }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_DATA_VISIBILITY: public
          DASHBOARD_DATA_BRANCH: dashboard-data
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'StockResearchWorkspace sippakorntwo@gmail.com' }}
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('financial_audit_job.py');s=p.read_text()
          old="if ticker in ('AAPL','MSFT','ORCL','TSLA','AMZN','NVDA','JPM','O','AAAU','QQQI'):examples[ticker]=review"
          new="if ticker in ('AAPL','MSFT','ORCL','TSLA','AMZN','NVDA','JPM','O','AAAU','QQQI'):examples[ticker]={'counts':review['counts'],'fiscal_period':review['fiscal_period'],'metrics':{r['key']:{k:r[k] for k in ('value','unit','status','basis','grade')} for r in review['rows']}}"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          python financial_audit_job.py --enrich --publish > work/financial-data.log 2>&1 || { tail -70 work/financial-data.log; exit 1; }
      - name: Record task outcome with tested source
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from verification_report import publish_report
          logs={p.name:p.read_text(errors='replace')[-16000:] for p in Path('work').glob('financial-*.log')}
          publish_report('v28-data-task',{'result':os.environ['RESULT'],'logs':logs})
          PY
      - name: Preserve financial audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-financial-audit
          path: |
            work/company-*.csv
            work/*-report.json
            work/financial-*.log
          retention-days: 7
