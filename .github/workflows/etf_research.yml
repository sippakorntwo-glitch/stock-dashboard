name: Collect ETF research observations
on:
  push:
    branches: [main]
    paths: [etf_research.py, etf_research_job.py, .github/workflows/etf_research.yml]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: read
concurrency:
  group: etf-research-collection
  queue: max
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'sippakorntwo-glitch/stock-dashboard' && github.ref == 'refs/heads/main' && toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: prepared-market-data
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify ETF data semantics
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q tests/test_etf_research.py
      - name: Collect due fund profiles and holdings
        env:
          DASHBOARD_DATA_REPO: ${{ github.repository }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_DATA_VISIBILITY: public
          DASHBOARD_DATA_BRANCH: dashboard-data
          PYTHONUNBUFFERED: '1'
        run: python etf_research_job.py --publish --limit 60 --minutes 8
      - name: Preserve collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-research-observations
          path: work/etf-research-report.json
          retention-days: 14
