name: Backfill English return periods
on:
  push:
    branches: [feat/english-return-periods-v20]
    paths: [backfill_returns.py, .github/workflows/backfill_returns.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepared-market-data
  cancel-in-progress: false
jobs:
  backfill:
    if: github.repository == 'sippakorntwo-glitch/stock-dashboard' && toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the exact calculation source before publishing data
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q tests
      - name: Recalculate all canonical symbols and extend actual price history
        env:
          DASHBOARD_DATA_REPO: ${{ github.repository }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_DATA_VISIBILITY: public
          DASHBOARD_DATA_BRANCH: dashboard-data
          DASHBOARD_CACHE_FILE: work/return_backfill.sqlite3
          PYTHONUNBUFFERED: '1'
        run: python backfill_returns.py --minutes 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-period-backfill-audit
          path: work/returns_backfill.json
          retention-days: 7
