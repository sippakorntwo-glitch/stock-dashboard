name: Validate dashboard
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements-dev.txt
      - name: Compile and test with real Streamlit and mocked data providers
        run: |
          python -m compileall -q .
          python -m pytest -q tests
      - name: Install browser for actual server startup check
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check real server startup and read-only prepared data
        env:
          PYTHONUNBUFFERED: '1'
        run: python server_smoke.py
