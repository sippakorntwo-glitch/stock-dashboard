name: Deploy and verify workspace
on:
  push:
    branches: [main]
    paths: ['*.py', 'requirements*.txt', '.streamlit/**', '.github/workflows/deploy_verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: prepared-market-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test real dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q tests
      - name: Prepare initial real data and publish
        env:
          DASHBOARD_DATA_REPO: ${{ github.repository }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_DATA_VISIBILITY: public
          DASHBOARD_DATA_BRANCH: dashboard-data
          DASHBOARD_CACHE_FILE: work/dashboard_cache.sqlite3
          PYTHONUNBUFFERED: '1'
        run: python deployment_seed.py
  ranking:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: top10-ranking-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - name: Publish whole-catalog Top 10 board
        env:
          DASHBOARD_DATA_REPO: ${{ github.repository }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_DATA_VISIBILITY: public
          DASHBOARD_DATA_BRANCH: dashboard-data
          PYTHONUNBUFFERED: '1'
        run: python ranking_job.py --publish
  browser:
    needs: [seed, ranking]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium verifier
        run: |
          python -m pip install playwright==1.55.0 requests==2.34.2
          python -m playwright install --with-deps chromium
      - name: Verify actual deployed site, all research sections and new controls
        env:
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python verify_workspace.py --production
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-evidence
          path: |
            work/*-report.json
            work/*.png
            work/browser-output.log
          retention-days: 7
  bootstrap:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: prepared-market-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Continue filling the full catalog
        env:
          DASHBOARD_DATA_REPO: ${{ github.repository }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_DATA_VISIBILITY: public
          DASHBOARD_DATA_BRANCH: dashboard-data
          DASHBOARD_CACHE_FILE: work/dashboard_cache.sqlite3
          PYTHONUNBUFFERED: '1'
        run: python update_data.py --mode bootstrap --price-minutes 12 --metadata-minutes 5 --metadata-limit 200
