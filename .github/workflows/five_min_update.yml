name: Update market data (free)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = update prices; bootstrap = fill missing history / info / dividends"
        type: choice
        options: [daily, bootstrap]
        default: daily
  schedule:
    # 13:17 Thailand, Tue-Sat. New York has crossed midnight (including winter).
    - cron: "17 6 * * 2-6"
    # Missing-data continuation, not a live quote stream.
    - cron: "17 0,12,18 * * *"
permissions:
  contents: write
concurrency:
  group: prepared-market-data
  cancel-in-progress: false
jobs:
  update:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      DASHBOARD_DATA_REPO: ${{ github.repository }}
      DASHBOARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DASHBOARD_DATA_VISIBILITY: public
      DASHBOARD_DATA_BRANCH: dashboard-data
      DASHBOARD_CACHE_FILE: work/dashboard_cache.sqlite3
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Validate required files
        run: |
          test -f update_data.py
          test -f data_sync.py
          test -f github_store.py
          test -f dashboard_core.py
          python -m compileall -q app.py dashboard_core.py dashboard_runtime.py dashboard_ui.py analytics.py update_data.py data_sync.py github_store.py
      - name: Update and publish prepared data
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUEST_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$REQUEST_MODE"
          elif [ "$SCHEDULE" = "17 6 * * 2-6" ]; then
            mode="daily"
          else
            mode="bootstrap"
          fi
          # Larger bounded work budgets support the expanded catalog. Request
          # pacing, per-symbol cooldowns and the provider circuit breaker remain.
          if [ "$mode" = "daily" ]; then
            python update_data.py --mode daily --price-minutes 40 --metadata-minutes 45 --metadata-limit 4500
          else
            python update_data.py --mode bootstrap --price-minutes 35 --metadata-minutes 28 --metadata-limit 3000
          fi
