name: 5-Minute Auto Price Updater

on:
  schedule:
    # รันอัตโนมัติทุก 5 นาที
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast updater
        run: python fast_updater.py

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_watchlist.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prices [skip ci]" && git push)
