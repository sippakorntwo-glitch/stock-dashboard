name: 5-Minute Auto Price Updater

on:
  schedule:
    # รันทุก 5 นาที เฉพาะช่วง 13:00 - 21:59 UTC (ตรงกับ 20:00 - 04:59 น. เวลาไทย) วันจันทร์ - ศุกร์
    # ครอบคลุมเวลาตลาดหุ้นสหรัฐเปิดพอดี (ประหยัดโควตานาทีฟรีของ GitHub และไม่โดนแบน)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------------------
      # กลับมาใช้ fast_updater.py เพื่ออัปเดตราคาแบบไว (ไม่ใช้ screener แล้ว)
      # -------------------------------------------------------------
      - name: Run fast updater
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python fast_updater.py

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_watchlist.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prices [skip ci]" && git push)
