name: Update market data (free)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = update prices; bootstrap = fill missing history / info / dividends"
        type: choice
        options: [daily, bootstrap]
        default: daily
  schedule:
    # 13:17 Thailand, Tue-Sat. New York has crossed midnight (including winter).
    - cron: "17 6 * * 2-6"
    # 07:17, 19:17 and 01:17 Thailand; only missing data, auto-skip once complete.
    - cron: "17 0,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: prepared-market-data
  cancel-in-progress: false

jobs:
  update:
    # Evaluated before allocating a runner. Null/unknown visibility fails closed.
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DASHBOARD_DATA_REPO: ${{ github.repository }}
      DASHBOARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DASHBOARD_DATA_VISIBILITY: public
      DASHBOARD_DATA_BRANCH: dashboard-data
      DASHBOARD_CACHE_FILE: work/dashboard_cache.sqlite3
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Update and publish prepared data
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUEST_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$REQUEST_MODE"
          elif [ "$SCHEDULE" = "17 6 * * 2-6" ]; then
            mode="daily"
          else
            mode="bootstrap"
          fi
          python update_data.py --mode "$mode" --price-minutes 35 --metadata-minutes 20 --metadata-limit 1000
