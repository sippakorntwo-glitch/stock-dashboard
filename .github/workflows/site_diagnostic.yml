name: Public site diagnostic
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/site_diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Inspect public app without authentication
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              errors = []
              page.on('pageerror', lambda error: errors.append(str(error)[:500]))
              response = page.goto('https://my-stock-terminal.streamlit.app/', wait_until='domcontentloaded', timeout=60000)
              page.wait_for_timeout(20000)
              u = urlsplit(page.url)
              result = {'http_status': response.status if response else None,
                        'url': u.scheme + '://' + u.netloc + u.path,
                        'title': page.title(), 'headings': page.get_by_role('heading').all_text_contents(),
                        'public_text': page.locator('body').inner_text()[:9000],
                        'exceptions': page.locator('[data-testid="stException"]').all_text_contents(),
                        'javascript_errors': errors}
              print('PUBLIC_SITE_DIAGNOSTIC:', json.dumps(result, ensure_ascii=False), flush=True)
              for frame in page.frames[1:]:
                  u = urlsplit(frame.url)
                  print('FRAME:', u.scheme + '://' + u.netloc + u.path, flush=True)
              browser.close()
          PY
