name: Assemble auditable screener expansion
on:
  push:
    branches: [feat/returns-filters-etf-v21]
    paths: [assemble_screener_v21.py, .github/workflows/assemble_screener.yml]
permissions:
  contents: write
concurrency:
  group: assemble-screener-v21
  cancel-in-progress: false
jobs:
  assemble:
    if: ${{ github.repository == 'sippakorntwo-glitch/stock-dashboard' && github.ref == 'refs/heads/feat/returns-filters-etf-v21' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-dev.txt
      - name: Apply guarded integration and fetch official directory
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python assemble_screener_v21.py
          python -m compileall -q .
      - name: Preserve assembled source on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py analytics.py dashboard_runtime.py dashboard_ui.py dashboard_views.py data_sync.py update_data.py workspace_boot.py investigate_returns.py etf_directory.json tests/ '*smoke.py'
          git diff --cached --stat
          git commit -m 'Integrate dated return ledger, English advanced screener and official ETF directory'
          git push origin HEAD:feat/returns-filters-etf-v21
      - name: Run complete real Streamlit unit and application tests
        run: python -m pytest -q tests
