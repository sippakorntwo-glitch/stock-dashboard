name: Preview LINE five-stock report
on:
  push:
    branches: [main]
    paths: ['.github/workflows/line_alert_preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: line-stock-alert-delivery
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: |
          python -m pip install -q -r requirements-line-alerts.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
      - name: Verify report and delivery checks
        run: |
          python -m unittest discover -s tests -p 'test_line_alert*.py'
          python -m unittest discover -s tests -p 'test_stock_alert*.py'
      - name: Send the requested five-stock report example once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python line_alerts.py --mode preview
      - name: Preserve exact report files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line-five-stock-preview
          path: work/line-report/
          if-no-files-found: ignore
          retention-days: 7
