name: Verify short-term stock screening
on:
  push:
    branches: [main]
    paths: ['.github/workflows/short_term_review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reporting dependencies and Thai font
        run: |
          python -m pip install -q -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
      - name: Verify full regression suite
        run: python -m pytest -q
      - name: Use a verified current universe or rebuild it from the checkpoint
        env:
          DASHBOARD_DATA_REPO: ${{ github.repository }}
          DASHBOARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_DATA_VISIBILITY: public
          DASHBOARD_DATA_BRANCH: dashboard-data
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os, subprocess, sys
          from pathlib import Path
          from ranking_board import _fetch_ranking
          from short_term_engine import validate_pool, MODEL
          data, _ = _fetch_ranking(os.environ['GITHUB_REPOSITORY'])
          try:
              if ((data or {}).get('short_term_pool', {}).get('model') != MODEL
                      or (data or {}).get('short_term_pool', {}).get('context_version') != 2):
                  raise ValueError('Rebuild the expanded event universe')
              validate_pool((data or {}).get('short_term_pool'), datetime.now(timezone.utc))
          except (ValueError, TypeError, KeyError):
              subprocess.run([sys.executable, 'ranking_job.py', '--no-quote-refresh', '--publish', '--output', 'work/short-term-input.json'], check=True)
          else:
              Path('work').mkdir(exist_ok=True)
              Path('work/short-term-input.json').write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
          PY
      - name: Restore pinned Thai translation model
        uses: actions/cache@v4
        with:
          path: work/thai-model
          key: thai-qwen3-4b-bc640142-llama-b11349-v1
      - name: Restore exact-source Thai translations
        uses: actions/cache@v4
        with:
          path: work/thai-translations.json
          key: thai-finance-v1-${{ github.run_id }}
          restore-keys: thai-finance-v1-
      - name: Prepare offline Thai translator before live prices
        timeout-minutes: 3
        continue-on-error: true
        run: python prepare_thai_translation.py
      - name: Inspect live news, volume and conditional plans without sending LINE
        run: python short_term_service.py --input work/short-term-input.json --output work/short-term-review
      - name: Publish the reviewed market event board without sending LINE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from line_alerts import GitHubState, JsonHTTP
          from market_event_monitor import publish_board
          store = GitHubState(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'], JsonHTTP())
          report = json.loads(Path('work/short-term-review/briefing.json').read_text())
          publish_board(store, report)
          print('EVENT_BOARD_REVIEW:', json.dumps({'events': [(e['ticker'], round(e['change_pct'], 2), e['status']) for e in report['events']], 'plans': len(report['cards']), 'universe': report['counts'].get('universe', 0)}))
          PY
      - name: Preserve coverage, rejections and exact report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-term-live-review
          path: |
            work/short-term-input.json
            work/short-term-review/
          if-no-files-found: ignore
          retention-days: 7
