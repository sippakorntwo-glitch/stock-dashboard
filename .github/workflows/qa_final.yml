name: Final rendered export consistency
on:
  push:
    branches: [feat/returns-filters-etf-v21]
    paths: [.github/workflows/qa_final.yml]
permissions:
  contents: write
concurrency:
  group: finish-workspace-source
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'sippakorntwo-glitch/stock-dashboard' && github.ref == 'refs/heads/feat/returns-filters-etf-v21'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -q -r requirements-dev.txt playwright==1.55.0
          python -m playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -80 /tmp/browser-install.log; exit 1; }
      - name: Apply and test final ordering
        run: |
          mkdir -p work
          python align_export_ready.py
          python -m compileall -q .
          python -m pytest -q tests > work/final-tests.log 2>&1 || { tail -140 work/final-tests.log; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m 'Tie filter acknowledgement to the fully rendered table and export payload'
          git push origin HEAD:feat/returns-filters-etf-v21
          git archive --format=zip HEAD > work/review-source.zip
      - name: Record successful tests independently of browser outcome
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from verification_report import publish_report
          publish_report('unit',{'result':'success','tested_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tests':Path('work/final-tests.log').read_text()})
          PY
      - name: Strict whole-site browser recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python verify_workspace.py
      - name: Record workflow outcome separately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          from verification_report import publish_report
          p=Path('work/final-tests.log')
          publish_report('release-task',{'result':os.environ['RESULT'],'tested_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tests':p.read_text(errors='replace')[-20000:] if p.exists() else 'Test step did not start'})
          PY
      - name: Preserve final code and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-rendered-export-evidence
          path: |
            work/review-source.zip
            work/*-report.json
            work/*.png
            work/*.log
          retention-days: 3
