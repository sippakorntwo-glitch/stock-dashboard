name: Complete browser review fixes
on:
  push:
    branches: [feat/returns-filters-etf-v21]
    paths: [.github/workflows/qa_patch.yml]
permissions:
  contents: write
concurrency:
  group: finish-workspace-source
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'sippakorntwo-glitch/stock-dashboard' && github.ref == 'refs/heads/feat/returns-filters-etf-v21'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-dev.txt
      - name: Apply reviewed corrections and run all regressions
        run: |
          mkdir -p work
          python polish_workspace.py
          python -m compileall -q .
          python -m pytest -q tests > work/final-tests.log 2>&1 || { tail -140 work/final-tests.log; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m 'Fix verifier count shadowing, instant initial chart readiness and directory labeling'
          git push origin HEAD:feat/returns-filters-etf-v21
          git archive --format=zip HEAD > work/review-source.zip
      - name: Independently reconcile every published observed return
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python audit_all_returns.py --probe-missing > work/arithmetic-audit.log 2>&1 || { tail -80 work/arithmetic-audit.log; exit 1; }
      - name: Record tested source and result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          from verification_report import publish_report
          logs={p.name:p.read_text(errors='replace')[-18000:] for p in Path('work').glob('*.log')}
          publish_report('unit',{'result':os.environ['RESULT'],'tested_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'logs':logs})
          PY
      - name: Preserve source and arithmetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-review-evidence
          path: |
            work/review-source.zip
            work/*-report.json
            work/*.log
          retention-days: 3
